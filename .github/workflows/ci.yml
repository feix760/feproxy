name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '24' ]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      # Local development uses pnpm 11; pin the major to keep them in sync
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # prepare runs pnpm run build; the static-asset cases need lib/public
      - run: pnpm install --frozen-lockfile

      # lint + build + jest
      - run: pnpm test

      - name: Upload coverage
        if: matrix.node == '24'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
