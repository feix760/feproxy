<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FeProxy">
  <!--
    Three staggered arrows are the devtools Network waterfall: requests starting at different times,
    running different lengths. The vertical seam they all cross is the proxy, and the ring node on the
    middle one is the hop through it. The seam is drawn under the arrows, so they occlude it into
    dashes on their own. Arrowheads rather than plain bars keep this from reading as Material's
    tune/equalizer icon (three lines with a knob).

    Geometry sits on a 32 grid with even coordinates, so edges stay crisp when rasterized down to
    16x16 for favicon.ico. Each bar body runs 1 unit past its arrowhead base, hiding the rounded
    corner inside the head. Blue is devtools' sys-color-primary-bright to sys-color-primary pair
    (see page/admin/theme.less).
  -->
  <defs>
    <linearGradient id="feproxy-badge" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b6ef3"/>
      <stop offset="1" stop-color="#0b57d0"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#feproxy-badge)"/>
  <path d="M15 3v26" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <g fill="#fff">
    <rect x="4" y="6" width="13" height="4" rx="1"/>
    <path d="m16 3.5 6 4.5-6 4.5z"/>
    <rect x="8" y="14" width="15" height="4" rx="1"/>
    <path d="m22 11.5 6 4.5-6 4.5z"/>
    <rect x="10" y="22" width="9" height="4" rx="1"/>
    <path d="m18 19.5 6 4.5-6 4.5z"/>
    <circle cx="15" cy="16" r="3.5"/>
  </g>
  <circle cx="15" cy="16" r="1.5" fill="url(#feproxy-badge)"/>
</svg>
